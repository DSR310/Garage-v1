<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#111827'><title>Diagnostic Services & Repairs</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}main{max-width:760px;margin:auto;padding:14px 14px 80px}.card{background:white;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}input,textarea,select{width:100%;padding:11px;margin:5px 0 10px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;font-size:16px}button{padding:11px 14px;border:0;border-radius:8px;font-weight:bold;margin:3px}.primary{background:#111827;color:white}.secondary{background:#e5e7eb}.success{background:#dcfce7}.danger{background:#fee2e2}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 80px 100px 35px;gap:6px;align-items:end}.total{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:20px;font-weight:bold;border-top:1px solid #ddd;margin-top:5px;padding-top:10px}.job{padding:12px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.invoice{background:#fff;padding:24px}.invtop{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:15px}.right{text-align:right}@media(max-width:550px){.row{grid-template-columns:1fr 65px 90px 32px}.invtop{display:block}.right{text-align:left}}@media print{header,.no-print{display:none!important}body{background:white}.invoice{padding:0}}</style></head><body><header><b>Diagnostic Services and Repairs Ltd</b><small style='display:block'>Garage Management V1</small></header><main>
<section id='home'><div class='card'><button class='primary' onclick='newJob()'>+ New Job</button><button class='secondary' onclick='show("customers")'>Customers</button><button class='secondary' onclick='show("invoices")'>Invoices</button></div><div class='card'><h2>Jobs</h2><div id='jobs'></div></div></section>
<section id='editor' class='hidden'><div class='card'><button onclick='show("home")'>← Jobs</button><h2 id='jt'>New Job</h2><label>Customer</label><input id='name'><label>Mobile</label><input id='phone' type='tel'><label>Email</label><input id='email'><label>Registration</label><input id='reg'><label>Make / model</label><input id='car'><label>Mileage</label><input id='mileage' type='number'><label>Status</label><select id='status'><option>Booked</option><option>In Progress</option><option>Waiting for Parts</option><option>Ready</option><option>Invoiced</option></select><label>Work required / notes</label><textarea id='notes'></textarea><button class='secondary' onclick='call()'>📞 Call</button><button class='secondary' onclick='text()'>💬 Text</button></div><div class='card'><h2>Parts</h2><div id='parts'></div><button onclick='addPart()'>+ Add Part</button></div><div class='card'><h2>Labour</h2><div id='labour'></div><button onclick='addLabour()'>+ Add Labour</button></div><div class='card'><h2>Totals</h2><div class='total'>Net <b id='net'>£0.00</b></div><div class='total'>VAT 20% <b id='vat'>£0.00</b></div><div class='total grand'>Total <b id='gross'>£0.00</b></div><button class='primary' onclick='saveJob()'>Save Job</button><button class='success' onclick='invoice()'>Convert to Invoice</button></div></section>
<section id='customers' class='hidden'><div class='card'><button onclick='show("home")'>← Back</button><button class='primary' onclick='newCustomer()'>+ Customer</button></div><div class='card'><h2>Customers</h2><div id='customerList'></div></div></section>
<section id='customerEdit' class='hidden'><div class='card'><button onclick='show("customers")'>← Back</button><h2>Customer</h2><label>Name</label><input id='cn'><label>Mobile</label><input id='cp' type='tel'><label>Email</label><input id='ce'><label>Address</label><textarea id='ca'></textarea><button class='primary' onclick='saveCustomer()'>Save</button></div></section>
<section id='invoices' class='hidden'><div class='card'><button onclick='show("home")'>← Back</button><h2>Invoices</h2><div id='invoiceList'></div></div></section>
<section id='invoiceView' class='hidden'><div class='card no-print'><button onclick='show("invoices")'>← Invoices</button><button class='primary' onclick='print()'>Print / Save PDF</button></div><div id='invoiceContent' class='invoice'></div></section></main>
<script>const KEY='dsr-v1';let d=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"customers":[],"invoices":[],"jn":1,"in":1}'),j=null;const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n||0);function save(){localStorage.setItem(KEY,JSON.stringify(d))}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='home')renderJobs();if(id==='customers')renderCustomers();if(id==='invoices')renderInvoices();scrollTo(0,0)}function newJob(){j={id:Date.now(),no:d.jn++,name:'',phone:'',email:'',reg:'',car:'',mileage:'',status:'Booked',notes:'',parts:[],labour:[],inv:null};d.jobs.unshift(j);save();load();show('editor')}function edit(id){j=d.jobs.find(x=>x.id===id);load();show('editor')}function load(){[['name','name'],['phone','phone'],['email','email'],['reg','reg'],['car','car'],['mileage','mileage'],['notes','notes']].forEach(a=>$(a[0]).value=j[a[1]]||'');$('status').value=j.status;$('jt').textContent='Job #'+j.no;lines();calc()}function collect(){['name','phone','email','reg','car','mileage','notes'].forEach(k=>j[k]=$(k).value);j.status=$('status').value}function addPart(){j.parts.push({d:'',q:1,p:0});lines()}function addLabour(){j.labour.push({d:'',h:1,r:0});lines()}function lines(){$('parts').innerHTML=j.parts.map((x,i)=>`<div class=row><input placeholder=Description value="${x.d}" oninput="j.parts[${i}].d=this.value"><input type=number value=${x.q} oninput="j.parts[${i}].q=+this.value;calc()"><input type=number step=.01 value=${x.p} oninput="j.parts[${i}].p=+this.value;calc()"><button onclick="j.parts.splice(${i},1);lines();calc()">×</button></div>`).join('')||'<p>No parts.</p>';$('labour').innerHTML=j.labour.map((x,i)=>`<div class=row><input placeholder=Description value="${x.d}" oninput="j.labour[${i}].d=this.value"><input type=number step=.25 value=${x.h} oninput="j.labour[${i}].h=+this.value;calc()"><input type=number step=.01 value=${x.r} oninput="j.labour[${i}].r=+this.value;calc()"><button onclick="j.labour.splice(${i},1);lines();calc()">×</button></div>`).join('')||'<p>No labour.</p>'}function totals(x=j){let p=x.parts.reduce((a,v)=>a+(v.q||0)*(v.p||0),0),l=x.labour.reduce((a,v)=>a+(v.h||0)*(v.r||0),0),n=p+l;return[n,n*.2,n*1.2]}function calc(){let[t,v,g]=totals();$('net').textContent=money(t);$('vat').textContent=money(v);$('gross').textContent=money(g);save()}function saveJob(){collect();save();alert('Job saved');show('home')}function renderJobs(){$('jobs').innerHTML=d.jobs.length?d.jobs.map(x=>{let t=totals(x);return `<div class=job><div><b>#${x.no} — ${x.name||'No customer'}</b><br><small>${x.reg||''} ${x.car||''} · ${money(t[2])} · ${x.status}</small></div><button onclick="edit(${x.id})">Open</button></div>`}).join(''):'<p>No jobs yet.</p>'}function call(){if($('phone').value)location.href='tel:'+$('phone').value}function text(){if($('phone').value)location.href='sms:'+$('phone').value}function newCustomer(){['cn','cp','ce','ca'].forEach(x=>$(x).value='');show('customerEdit')}function saveCustomer(){d.customers.push({name:$('cn').value,phone:$('cp').value,email:$('ce').value,address:$('ca').value});save();show('customers')}function renderCustomers(){$('customerList').innerHTML=d.customers.length?d.customers.map(c=>`<div class=job><div><b>${c.name}</b><br><small>${c.phone||''}</small></div><span><button onclick="location.href='tel:${c.phone}'">📞</button><button onclick="location.href='sms:${c.phone}'">💬</button></span></div>`).join(''):'<p>No customers.</p>'}function invoice(){collect();let[t,v,g]=totals();let inv={no:'INV-'+String(d.in++).padStart(4,'0'),date:new Date().toLocaleDateString('en-GB'),job:JSON.parse(JSON.stringify(j)),t:[t,v,g],paid:false};d.invoices.unshift(inv);j.inv=inv.no;j.status='Invoiced';save();renderInvoice(inv);show('invoiceView')}function renderInvoices(){$('invoiceList').innerHTML=d.invoices.length?d.invoices.map(i=>`<div class=job><div><b>${i.no}</b><br><small>${i.job.name||''} · ${money(i.t[2])} · ${i.paid?'Paid':'Unpaid'}</small></div><button onclick='openInv("${i.no}")'>Open</button></div>`).join(''):'<p>No invoices.</p>'}function openInv(no){renderInvoice(d.invoices.find(x=>x.no===no));show('invoiceView')}function renderInvoice(i){let x=i.job,rows=[...x.parts.map(a=>[a.d,a.q,a.p,a.q*a.p]),...x.labour.map(a=>[a.d,a.h,a.r,a.h*a.r])];$('invoiceContent').innerHTML=`<div class=invtop><div><h1>Diagnostic Services and Repairs Ltd</h1>Rear of 310 Green Lanes<br>N13 5TT<br><b>VAT No: GB 298547047</b></div><div><h2>INVOICE</h2><b>${i.no}</b><br>${i.date}</div></div><p><b>Customer</b><br>${x.name}<br>${x.phone||''}<br>${x.email||''}</p><p><b>Vehicle</b><br>${x.reg||''} ${x.car||''}<br>Mileage: ${x.mileage||''}</p><table style='width:100%;border-collapse:collapse'><tr><th style='text-align:left'>Description</th><th>Qty/Hrs</th><th class=right>Rate</th><th class=right>Net</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class=right>${money(r[2])}</td><td class=right>${money(r[3])}</td></tr>`).join('')}</table><div style='margin-left:auto;max-width:280px'><div class=total>Net <b>${money(i.t[0])}</b></div><div class=total>VAT 20% <b>${money(i.t[1])}</b></div><div class='total grand'>Total <b>${money(i.t[2])}</b></div></div><div class=no-print><button class=success onclick='togglePaid("${i.no}")'>${i.paid?'Mark Unpaid':'Mark Paid'}</button></div>`}function togglePaid(no){let i=d.invoices.find(x=>x.no===no);i.paid=!i.paid;save();renderInvoice(i)}renderJobs();</script></body></html>
